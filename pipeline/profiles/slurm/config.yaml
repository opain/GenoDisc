# Snakemake 7.x "classic" cluster profile - each rule instance is submitted
# as its own sbatch job. NOT compatible with Snakemake 8's executor-plugin
# --executor slurm; do not "upgrade" this format without also bumping
# snakemake-minimal in envs/pipeline.yaml and re-testing everything.
#
# No rule declares threads: anywhere in this pipeline, so per-rule cpu
# requests come from the custom resources.cpus (declared on the handful of
# rules that shell out to multi-core R scripts; defaults to 1 otherwise), not
# {threads}.
#
# jobs / default-resources.runtime / latency-wait below are starting values,
# not measured ones - see the plan's Risks section for what to validate
# before relying on this for real submissions.

# --partition reads $GENODISC_PARTITIONS if the calling job's environment
# sets it - inherited automatically via sbatch's default --export=ALL, all
# the way down through run_genodisc.sh -> snakemake -> this per-rule sbatch
# call, with no other changes needed. Falls back to neurohack_cpu when
# unset, so a plain invocation is unaffected. Double-braced (${{...}})
# because this whole cluster: string is Python .format()'d by Snakemake
# with {rule}/{wildcards}/{resources...} below - a single-braced ${VAR}
# here would be parsed as a (nonexistent) format field instead of reaching
# the shell.
cluster:
  mkdir -p logs/slurm/{rule} &&
  sbatch
    --parsable
    --partition=${{GENODISC_PARTITIONS:-neurohack_cpu}}
    --job-name=gd-{rule}-{wildcards}
    --cpus-per-task={resources.cpus}
    --mem={resources.mem_mb}M
    --time={resources.runtime}
    --output=logs/slurm/{rule}/{rule}-{wildcards}-%j.out
    --error=logs/slurm/{rule}/{rule}-{wildcards}-%j.err

# Absolute path required: run_genodisc.sh invokes snakemake with
# --directory <job_dir>, which shifts snakemake's cwd (and hence this
# script's resolution point) to the job directory, not this profile's own
# directory.
#
# Invoked via "bash <script>" rather than relying on the file's own execute
# bit: this repo is accessed here through a CIFS mount that reports a forced
# 0770 view which doesn't reliably reflect the real permission bits SLURM
# jobs see natively on cephfs (confirmed: chmod over the mount errors with
# "Operation not permitted", so it can't be fixed/verified from this side) -
# jobs failed with "Permission denied" executing the script directly even
# though the path itself resolved correctly. "bash <script>" only needs read
# access.
cluster-status: "bash /scratch/prj/neurohackpain/GenoDisc/repo/current/pipeline/profiles/slurm/slurm-status.sh"
cluster-cancel: "scancel"

default-resources:
  - mem_mb=4000
  - disk_mb=4000
  - cpus=1
  - runtime=480

# Per-rule walltimes derived from recorded benchmarks (max observed x1.5, floored
# at 10 min); generated by scripts/derive_pipeline_runtimes.py in the genodisc-web
# repo. A flat 8h default made short jobs sit in the queue (backfill can't slot a
# long job into a small gap); these right-sized limits let them schedule. Rules
# NOT listed here fall through to the default runtime=480 above. Regenerate as
# more jobs accrue. Derived 2026-09-23 from 17219 benchmark files (chr22-only
# test-mode runs excluded). The trailing comments are n=samples, max=observed max.
set-resources:
  - clump:runtime=10    # n=687, max=39s
  - cojo:runtime=216    # n=176, max=8604s
  - combine_twas_res:runtime=10    # checkpoint; n=38, max=31s
  - convert_pathway_gmt:runtime=10    # n=10, max=43s
  - finemap:runtime=11    # n=220, max=422s
  - format_eqtlgen_smr:runtime=10    # n=6, max=3s
  - format_magma_gene_results:runtime=10    # n=28, max=20s
  - format_magma_pathway_results:runtime=10    # n=28, max=8s
  - format_magma_results:runtime=10    # n=26, max=96s
  - format_metabrain_smr:runtime=10    # n=17, max=9s
  - format_sumstats_smr:runtime=10    # n=24, max=95s
  - format_twas_gsea_drugtargetor_nondirectional_results:runtime=10    # n=339, max=52s
  - format_twas_gsea_drugtargetor_results:runtime=10    # n=363, max=88s
  - format_twas_gsea_pathway_results:runtime=10    # n=446, max=13s
  - ldsc:runtime=10    # n=40, max=197s
  # ldsc_gencor is intentionally NOT set here: its runtime scales with the number
  # of reference GWAS and is set adaptively in the rule (ldsc_gencor_runtime in
  # rules/sumstat_qc.smk). A set-resources value here would override that.
  - ldsc_gencor_within:runtime=15    # whole-rule (loops over pairs); bounded by the 5-GWAS submission cap; max=78s
  - locus_plots:runtime=10    # n=28, max=214s
  - magma_drug_targetor:runtime=10    # n=26, max=32s
  - magma_gene_level:runtime=441    # n=30, max=17625s
  - magma_pathway:runtime=10    # n=28, max=26s
  - magma_tissue_conditional:runtime=10    # n=26, max=36s
  - magma_tissue_spec:runtime=10    # n=26, max=26s
  - manhattan_plot:runtime=10    # n=60, max=82s
  - package_results:runtime=10    # n=45, max=122s
  - process_clump:runtime=10    # n=29, max=85s
  - process_cojo:runtime=10    # n=8, max=33s
  - process_finemap:runtime=130    # n=10, max=5175s
  - process_ldsc_gencor:runtime=10    # n=24, max=10s
  - process_ldsc_gencor_within:runtime=10    # n=16, max=7s
  - process_rosmap_smr:runtime=10    # n=18, max=28s
  - qq_plot:runtime=10    # n=63, max=117s
  - retrieve_N:runtime=10    # n=34, max=56s
  - run_banner_pwas:runtime=10    # n=463, max=92s
  - run_eqtlgen_smr:runtime=19    # n=132, max=757s
  - run_psychencode_smr:runtime=10    # n=396, max=224s
  - run_rosmap_pwas:runtime=10    # n=513, max=104s
  - run_rosmap_smr:runtime=10    # n=396, max=97s
  - run_twas:runtime=33    # n=9248, max=1319s
  - run_twas_gsea_drug_targetor:runtime=10    # n=363, max=60s
  - run_twas_gsea_drug_targetor_nondirectional:runtime=10    # n=339, max=32s
  - smr_analysis_MetaBrain:runtime=10    # n=1933, max=357s
  - sumstat_prep_i:runtime=19    # n=67, max=759s
  - twas_gsea_pathway_nondirectional:runtime=10    # n=446, max=102s

jobs: 40
latency-wait: 90
restart-times: 2
max-jobs-per-second: 5
max-status-checks-per-second: 5
rerun-incomplete: true
use-conda: true
conda-frontend: mamba
