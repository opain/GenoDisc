# GenoDisc write-up registry — maps what a run exercised to its citation + version.
#
# Consumed by scripts/functions/writeup/registry.R. One entry per tool/method
# (`software:`) and per reference dataset (`datasets:`). The write-up generator
# includes an entry only when the run actually used it (a methods paragraph was
# emitted for a block that depends on it), and renders its version like so:
#   * conda_env + conda_pkg  -> version read LIVE from pipeline/envs/<env> at
#                               generation time (so bumping the env updates text).
#   * version                -> a literal string (binaries / git pins).
#   * unpinned: true         -> rendered as "version not pinned upstream" (honest
#                               gap: no version string exists anywhere for this tool).
# `bibkey` lists keys that MUST exist in writeup/references.bib (enforced by
# tests/testthat/test-writeup-references.R). `used_by` lists the config.yaml flags
# (or panel-list keys) that pull the entry in; it powers the coverage test.

software:
  - key: ldsc
    name: LD Score Regression (LDSC)
    version: "git commit aa33296"
    bibkey: [bulik2015ldsc]
    used_by: [ldsc]
    notes: "Runs in the pinned python2 env (envs/ldsc.yaml); tool itself is a git checkout in rules/dependencies.smk."

  - key: ldsc_rg
    name: cross-trait LD Score regression (genetic correlation)
    version: "git commit aa33296"
    bibkey: [bulik2015ldschrg]
    used_by: [gencor_gwas_list, gencor_within_gwas_list]

  - key: sbayesrc
