############
# Provide relevent paths
############

# Specify output directory
outdir: tests/output_full

# Location of this config file
config_file: tests/config_test_full.yaml

# Specify location of gwas_list file
gwas_list: tests/gwas_list_test_full.txt

# Specify resource directory (default: resources)
resdir: /scratch/prj/neurohackpain/GenoDisc/pipeline_resources

############
# Specify desired output
############

# Identify independent significant SNPs using clumping
clump: T

# Perform COJO analysis
cojo: T

# Perform SNP finemapping analysis
finemap: T

# Estimate SNP-heritability and intercept using LD score regression
ldsc: T

# Estimate genetic correlations
gencor_gwas_list: tests/gencor_gwas_list_test_full.txt

# MAGMA gene associations analysis
magma_gene: T

# MAGMA gene set enrichment analysis using DrugTargetor sets
magma_drugtargetor: T

# TWAS using FUSION panels
twas_panel_fusion: T

# Specify TWAS FUSION GTEx panels (minimal for speed)
gtex_weights: ['Whole_Blood']

# Conditional analyss of TWAS results
twas_conditional: T

# TWAS-GSEA gene property association analysis using DrugTargetor (directional)
twas_gsea_drugtargetor: T

# TWAS-GSEA gene set enrichment using DrugTargetor, non-directional (uses full .gmt; comparable to MAGMA)
twas_gsea_drugtargetor_nondirectional: T

# TWAS-GSEA against reprocessed CMAP level5 drug signatures
twas_gsea_cmap: T
cmap_level5_prop: /users/k1806347/oliverpainfel/Data/CMAP/reprocessed/CMAP_level5/lvl5Allcompounds_population_TWAS-GSEA_prop.rds
cmap_compoundinfo: /users/k1806347/oliverpainfel/Data/CMAP/compoundinfo_beta.txt
cmap_cell_iname: ['PC3']
cmap_pert_itime: ['24h']
cmap_pert_idose: ['10uM']

# MAGMA tissue-specific + conditional tissue enrichment (GTEx v8)
tissue_magma: T

