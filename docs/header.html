<!-- Theme: dark is the default; light is opt-in via <html data-theme="light">.
     Same mechanism and localStorage key ('genodisc_theme') as the web app, so the
     light/dark behaviour matches. Applied before first paint to avoid a flash. -->
<script>
  (function () {
    try {
      if (localStorage.getItem('genodisc_theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (e) { /* storage blocked - stay on default dark */ }
  })();
</script>

<label class="switch" title="Toggle light / dark theme">
  <input type="checkbox" id="themeToggle" checked>
  <span class="slider round"></span>
</label>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var KEY = 'genodisc_theme';
    var box = document.getElementById('themeToggle');
    if (!box) return;
    // checked == dark (the default). Reflect the current theme on load.
    box.checked = document.documentElement.getAttribute('data-theme') !== 'light';
    box.addEventListener('change', function () {
      if (box.checked) {
        document.documentElement.removeAttribute('data-theme');   // dark
        try { localStorage.setItem(KEY, 'dark'); } catch (e) {}
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        try { localStorage.setItem(KEY, 'light'); } catch (e) {}
      }
    });
  });
</script>
